<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <script type="text/javascript" defer src="./src/index.js"></script>
    <title>Parrot Party Clicker</title>
    <link href="/styles/styles.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <h1 id="clickCount">Clicks: 0 </h1>

      <img id="party-parrot" src="https://cultofthepartyparrot.com/parrots/hd/parrot.gif" />

    <!--  TODO: Add reset button -->
    <button id="addPartyParrots">Add count</button>
    <button id="reset">Reset</button>
    <!--  Extra: -->
    <main>
      <div id="box-one" class="box box--mouseover">
        <p>hover over me</p>
      </div>
      <div id="box-two" class="box box--keydown">
        <p id="box-two-text">press space</p>
      </div>
      <div id="box-three" class="box box--click">
        <p>click me</p>
      </div>
      <div id="box-four" class="box box--dblclick">
        <p>double click me</p>
      </div>
    </main>
  </body>
</html>
